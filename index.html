<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Projects</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
    }

    header {
      padding: 80px 20px 40px;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      margin: 0;
      letter-spacing: 1px;
    }

    header p {
      color: #a0a0a0;
      margin-top: 10px;
      font-size: 1rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
    }

    .card {
      background: #161a22;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 12px 14px;
    }

    .card-title {
      font-size: 1rem;
      margin: 0 0 6px;
    }

    .card-desc {
      font-size: 0.85rem;
      color: #a0a0a0;
      margin: 0;
    }

    footer {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 0.85rem;
    }

    a {
      color: inherit;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Projects</h1>
    <p>small experiments, big vibes ✦</p>
  </header>

  <div class="container">
    <div class="grid">

      <!-- CARD -->
      <a class="card" href="#">
        <img src="https://media.giphy.com/media/3o7aD2saalBwwftBIY/giphy.gif" alt="project gif">
        <div class="card-content">
          <h3 class="card-title">Project One</h3>
          <p class="card-desc">A cool animation system I built.</p>
        </div>
      </a>

      <a class="card" href="#">
        <img src="https://media.giphy.com/media/l0HlQ7LRalQqdWfao/giphy.gif" alt="project gif">
        <div class="card-content">
          <h3 class="card-title">Project Two</h3>
          <p class="card-desc">Interactive UI concept with motion.</p>
        </div>
      </a>

      <a class="card" href="#">
        <img src="https://media.giphy.com/media/xT9IgzoKnwFNmISR8I/giphy.gif" alt="project gif">
        <div class="card-content">
          <h3 class="card-title">Project Three</h3>
          <p class="card-desc">Experimental data visualization.</p>
        </div>
      </a>

      <a class="card" href="#">
        <img src="https://media.giphy.com/media/13HgwGsXF0aiGY/giphy.gif" alt="project gif">
        <div class="card-content">
          <h3 class="card-title">Project Four</h3>
          <p class="card-desc">A generative design study.</p>
        </div>
      </a>

    </div>
  </div>

  <footer>
    Built by you • hosted on GitHub Pages
  </footer>

</body>
</html>
